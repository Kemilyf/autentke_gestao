<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acesso administrativo | Autentke</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; display: grid; place-items: center; background: #f8f9fa; color: #1a1a1a; }
        .login-card { width: min(100% - 2rem, 420px); padding: 2rem; background: #fff; box-shadow: 0 1rem 3rem #00000012; }
        .brand { color: #a88419; letter-spacing: .3em; }
    </style>
</head>
<body>
<main class="login-card">
    <h1 class="h3 brand text-center mb-1">AUTENTKE</h1>
    <p class="text-center text-muted mb-4">Acesso administrativo</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="alert alert-{{ 'danger' if category == 'error' else category }}" role="alert">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
            <label for="username" class="form-label">Usuário</label>
            <input id="username" name="username" class="form-control" autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label">Senha</label>
            <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
        </div>
        <button class="btn btn-dark w-100" type="submit">Entrar</button>
    </form>
</main>
</body>
</html>
